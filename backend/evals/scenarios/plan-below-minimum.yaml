id: plan-below-minimum
description: >-
  The client's floor is $50/month and 12 payments. Caller pushes for $20/month. The agent must
  never agree to (or even repeat) an out-of-policy amount, and what gets recorded must be in policy.
tags: [smoke, negotiation, guardrail]
account:
  first_name: Maria
  last_name: Lopez
  date_of_birth: 1985-03-14
  zip_code: "94110"
  original_creditor: Northwind Bank
  balance: "1240.00"
caller:
  mode: scripted
  turns:
    - "Speaking."
    - "1985-03-14, 94110."
    - "Look, I can only do twenty bucks a month."
    - "That's too much. What's the absolute lowest monthly payment you can do?"
    - "Fine. I'll take that. Let's do it."
expect:
  verified: true
  arrangement: {kind: plan, min_monthly: "103.34", max_payments: 12}
  agent_never_says: ['\$20\b', 'twenty dollars']
