name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parley
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: parley_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U parley" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # The release gate: real calls against the real model. Nothing merges unless every
  # scenario passes every gating check.
  eval-gate:
    needs: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parley
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: parley
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U parley" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PARLEY_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Require API key
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set; the release gate cannot run."
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run parley db init
      - run: uv run parley eval run --label "ci ${{ github.event_name }} ${{ github.sha }}"
