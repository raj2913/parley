name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Full suite on demand (Actions tab -> ci -> Run workflow) and weekly.
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke or full"
        default: full
        type: choice
        options: [smoke, full]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parley
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: parley_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U parley" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # The release gate: real calls against the real model. Nothing merges unless every
  # scenario passes every gating check. Pushes and PRs run the smoke suite (free-tier
  # friendly); the full suite runs weekly and on demand.
  eval-gate:
    needs: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parley
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: parley
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U parley" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PARLEY_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUITE: ${{ github.event_name == 'schedule' && 'full' || inputs.suite || 'smoke' }}
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            # Forked PRs never receive secrets; skip rather than fail them.
            echo "::notice::GEMINI_API_KEY is not set, so the model eval gate was skipped. Add it under Settings -> Secrets and variables -> Actions."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - if: steps.key.outputs.available == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.available == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.key.outputs.available == 'true'
        run: uv sync --locked
      - if: steps.key.outputs.available == 'true'
        run: uv run parley db init
      - name: Run ${{ env.SUITE }} suite
        if: steps.key.outputs.available == 'true'
        run: |
          TAGS=""
          if [ "$SUITE" = "smoke" ]; then TAGS="--tag smoke"; fi
          uv run parley eval run $TAGS --label "ci $SUITE ${{ github.event_name }} ${{ github.sha }}"
